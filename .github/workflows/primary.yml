name: primary

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: primary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  primary:
    runs-on: macos-15
    timeout-minutes: 360

    env:
      # from your bitrise.yml "app.envs"
      BITRISE_PROJECT_PATH: SFSafeSymbols.xcodeproj
      BITRISE_SCHEME: SFSafeSymbols-Package

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_26.1.1.app/Contents/Developer"
          xcodebuild -version

      - name: Install iOS simulators
        shell: bash
        run: |
          brew uninstall xcodes || true
          brew install xcodesorg/made/xcodes
          echo
          echo "Available runtimes to install:"
          xcodes runtimes
          xcodes runtimes install "iOS 17.5"
          
          echo
          echo "Currently available simulators:"
          xcrun simctl list devices

      - name: Xcode Test for iOS (17.5)
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$BITRISE_PROJECT_PATH" \
            -scheme "$BITRISE_SCHEME" \
            -destination "platform=iOS Simulator,name=iPhone 15,OS=17.5" \
            -resultBundlePath "TestResults-iOS-17.5.xcresult"

      - name: Xcode Test for visionOS (26.1)
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$BITRISE_PROJECT_PATH" \
            -scheme "$BITRISE_SCHEME" \
            -destination "platform=visionOS Simulator,name=Apple Vision Pro,OS=26.1" \
            -resultBundlePath "TestResults-visionOS-26.1.xcresult"

      - name: Xcode Test for iOS (18.6)
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$BITRISE_PROJECT_PATH" \
            -scheme "$BITRISE_SCHEME" \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=18.6" \
            -resultBundlePath "TestResults-iOS-18.6.xcresult"

      - name: Xcode Test for iOS (26.1)
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$BITRISE_PROJECT_PATH" \
            -scheme "$BITRISE_SCHEME" \
            -destination "platform=iOS Simulator,name=iPhone 17,OS=26.1" \
            -resultBundlePath "TestResults-iOS-26.1.xcresult"

      - name: Xcode Test for tvOS (26.1)
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$BITRISE_PROJECT_PATH" \
            -scheme "$BITRISE_SCHEME" \
            -destination "platform=tvOS Simulator,name=Apple TV,OS=26.1" \
            -resultBundlePath "TestResults-tvOS-26.1.xcresult"

      - name: Xcode Test for watchOS (26.1)
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$BITRISE_PROJECT_PATH" \
            -scheme "$BITRISE_SCHEME" \
            -destination "platform=watchOS Simulator,name=Apple Watch SE (40mm) (2nd generation),OS=26.1" \
            -resultBundlePath "TestResults-watchOS-26.1.xcresult"

      - name: CocoaPods Lint
        shell: bash
        run: |
          pod lib lint --allow-warnings --verbose --platforms=ios,tvos,watchos,macos

      # 10) deploy-to-bitrise-io equivalent: keep artifacts
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-bundles
          path: |
            *.xcresult
